<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gestor Financeiro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#18181b">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="app-header">
        <h1 id="header-title">Dashboard</h1>
    </header>
    <main id="app-content">
        <section id="view-dashboard" class="view active">
            <div class="card kpi-card">
                <div class="kpi-title">SALDO DO MÊS</div>
                <div class="kpi-value" id="kpi-saldo">R$ 0,00</div>
            </div>
            <div class="kpi-row">
                <div class="card kpi-card half">
                    <div class="kpi-title">RECEITAS</div>
                    <div class="kpi-value rec" id="kpi-receitas">R$ 0,00</div>
                </div>
                <div class="card kpi-card half">
                    <div class="kpi-title">DESPESAS</div>
                    <div class="kpi-value des" id="kpi-despesas">R$ 0,00</div>
                </div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-title">DISPONÍVEL P/ GASTAR</div>
                <div class="kpi-value" id="kpi-acumulado">R$ 0,00</div>
            </div>
        </section>
        <section id="view-extrato" class="view">
            <div id="extrato-list" class="list-container"></div>
        </section>
        <section id="view-novo" class="view">
            <form id="form-novo" class="form-container">
                <div class="input-group">
                    <label>Data</label>
                    <input type="date" id="novo-data" required>
                </div>
                <div class="input-group">
                    <label>Descrição</label>
                    <input type="text" id="novo-item" placeholder="Ex: Mercado, Uber..." required>
                </div>
                <div class="input-group">
                    <label>Tipo</label>
                    <select id="novo-tipo">
                        <option value="Despesa">Despesa</option>
                        <option value="Receita">Receita</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Valor (R$)</label>
                    <input type="number" id="novo-valor" step="0.01" placeholder="0.00" required>
                </div>
                <div class="input-group">
                    <label>Categoria</label>
                    <select id="novo-categoria" required></select>
                </div>
                <div class="input-group">
                    <label>Conta / Cartão</label>
                    <select id="novo-conta" required></select>
                </div>
                <div class="input-group">
                    <label>Situação</label>
                    <select id="novo-status">
                        <option value="pago">Pago</option>
                        <option value="pendente">Pendente</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Salvar Lançamento</button>
            </form>
        </section>
        <section id="view-config" class="view">
            <div class="card">
                <h3>Backup Offline</h3>
                <p style="margin-top:8px; margin-bottom: 16px; color: #71717a; font-size: 0.9rem;">Exporte os dados salvos no seu iPhone para não perdê-los.</p>
                <button id="btn-export" class="btn-secondary">Baixar Extrato (CSV)</button>
            </div>
        </section>
    </main>
    <nav id="bottom-nav">
        <div class="nav-item active" data-target="view-dashboard"><span class="icon">📊</span><span class="label">Início</span></div>
        <div class="nav-item" data-target="view-extrato"><span class="icon">📋</span><span class="label">Extrato</span></div>
        <div class="nav-item" data-target="view-novo"><span class="icon">➕</span><span class="label">Novo</span></div>
        <div class="nav-item" data-target="view-config"><span class="icon">⚙️</span><span class="label">Backup</span></div>
    </nav>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("SW ok."));
        }
    </script>
</body>
</html>
